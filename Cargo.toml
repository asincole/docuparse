[package]
name = "docuparse"
version = "0.0.4"
edition = "2024"
description = "Document extraction and parsing - PDF text, rendering, and OCR"
documentation = "https://docs.rs/docuparse"
readme = "README.md"
repository = "https://github.com/asincole/docuparse"
license = "MIT"
keywords = [
  "document",
  "extraction",
  "ocr",
  "parsing",
  "pdf",
]
categories = [
  "parser-implementations",
  "text-processing",
]
exclude = [
  "crates/",
  "examples/fixtures/",
  "mise.local.toml",
  "mise.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["crates/docuparse-cli"]

[workspace.package]
edition = "2024"
repository = "https://github.com/asincole/docuparse"
license = "MIT"

[workspace.metadata.release-plz]
semver-checks = false

[workspace.dependencies]
hotpath = "0.27.0"
image = "0.25.10"
pdfium-render = "0.9.4"
serde = "1.0.229"
serde_json = "1.0.151"

[[example]]
name = "ocr_onnx"
required-features = ["ocr-onnx"]

[[example]]
name = "ocr_openai"
required-features = ["ocr-openai"]

[[example]]
name = "ocr_parallel"
required-features = ["ocr-onnx", "parallel"]

[[test]]
name = "onnx_integration"
required-features = ["ocr-onnx"]

[dependencies]
base64 = { version = "0.23.1", optional = true }
bon = "3.10.1"
hotpath = { workspace = true }
image = { workspace = true }
oar-ocr = { version = "0.9.2", optional = true }
once_cell = "1.21.4"
pdfium-render = { workspace = true }
rayon = { version = "1.12", optional = true }
reqwest = { version = "0.13.5", features = ["blocking", "json"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = "2.0.21"
turbojpeg = { version = "1.5.1", features = ["image"], optional = true }

[dev-dependencies]
fake = { version = "5.1.0", features = ["derive"] }
image = { workspace = true }
lopdf = "0.45.0"
rstest = "0.27.0"
tempfile = "3.27.0"

[features]
default = []
hotpath = [
  "hotpath/hotpath",
]
hotpath-alloc = [
  "hotpath",
  "hotpath/hotpath-alloc",
]
ocr = []
ocr-onnx = ["dep:oar-ocr", "ocr"]
ocr-openai = [
  "dep:base64",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:turbojpeg",
  "ocr",
]
parallel = ["dep:rayon"]

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "thin"
panic = "abort"
codegen-units = 1
