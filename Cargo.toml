[package]
name = "docuparse"
version = "0.0.2"
edition = "2024"
description = "Document extraction and parsing - PDF text, rendering, and OCR"
readme = "README.md"
license = "MIT"
repository = "https://github.com/asincole/docuparse"
keywords = ["pdf", "document", "extraction", "ocr", "parsing"]
categories = ["text-processing", "parser-implementations"]
exclude = [
    "examples/fixtures/",
    "mise.toml",
    "mise.local.toml",
    "rust-toolchain.toml",
    "rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "ocr_onnx"
required-features = ["ocr-onnx"]

[[example]]
name = "ocr_openai"
required-features = ["ocr-openai"]

[[example]]
name = "ocr_parallel"
required-features = ["ocr-onnx", "parallel"]

[[test]]
name = "onnx_integration"
required-features = ["ocr-onnx"]

[dependencies]
bon = "3.9.1"
image = "0.25.10"
once_cell = "1.21.4"
pdfium-render = { version = "0.9.1" }
thiserror = "2.0.18"
oar-ocr = { version = "0.6.3", optional = true }
rayon = { version = "1.10", optional = true }
reqwest = { version = "0.13.3", features = ["blocking", "json"], optional = true }
base64 = { version = "0.22.1", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
turbojpeg = { version = "1.4.0", features = ["image"], optional = true }
hotpath = { version = "0.16.1" }

[dev-dependencies]
lopdf = "0.40.0"
rstest = "0.26.1"
tempfile = "3.27.0"
fake = { version = "5.1.0", features = ["derive"] }
image = "0.25.10"

[features]
default = []
ocr = []
parallel = ["dep:rayon"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc", "hotpath"]
ocr-onnx = ["ocr", "dep:oar-ocr"]
ocr-openai = ["ocr", "dep:reqwest", "dep:base64", "dep:serde_json", "dep:serde", "dep:turbojpeg"]

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
