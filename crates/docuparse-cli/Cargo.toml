[package]
name = "docuparse-cli"
version = "0.1.0"
edition.workspace = true
description = "Command-line PDF text extraction, rendering, and OCR on top of docuparse"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = [
  "cli",
  "ocr",
  "pdf",
  "text-extraction",
]
categories = [
  "command-line-utilities",
  "text-processing",
]

[dependencies]
docuparse = { path = "../..", version = "0.0.4" }
hotpath = { workspace = true }
image = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
usage-rs = { version = "6.4.1", features = ["completions"] }

[dev-dependencies]
lopdf = "0.45.0"
rstest = "0.27.0"
tempfile = "3.27.0"
usage-rs = { version = "6.4.1", features = ["test"] }

[features]
hotpath = [
  "docuparse/hotpath",
  "hotpath/hotpath",
]
hotpath-alloc = [
  "docuparse/hotpath-alloc",
  "hotpath",
  "hotpath/hotpath-alloc",
]
ocr = [
  "docuparse/ocr-onnx",
  "docuparse/ocr-openai",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cli-v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/cli-v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
