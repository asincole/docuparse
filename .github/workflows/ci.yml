name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: CI Checks & Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          bootstrap: true
          bootstrap_args: "--yes"
          bootstrap_skip: "task"
          cache: true

      - uses: jdx/mr-boxington-action@v1
        with:
          save-on-workflow-dispatch: "true"

      - name: Cache ort downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ort.pyke.io
            ~/.cache/ort
            ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ort-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: mise run fmt-check

      - name: Clippy
        run: mise run lint

      - name: Tests
        run: mise run test

      - name: Build docs
        run: mise run docs
